# ============================================================
#  AIBots - physical AI players for Paper
# ============================================================

# AI provider settings. Any OpenAI-compatible endpoint works.
# provider presets (base-url is filled automatically):
#   openrouter | openai | groq | deepseek | mistral | xai |
#   together | ollama | lmstudio | custom
ai:
  provider: openrouter
  # Your API key. For ollama/lmstudio you can leave this empty.
  api-key: "sk-or-v1-YOUR_KEY_HERE"
  model: "openai/gpt-4o-mini"
  # Only needed when provider is 'custom' or you want to override the preset.
  base-url: ""
  temperature: 0.7
  max-tokens: 400
  request-timeout-seconds: 30

# Global behaviour
behavior:
  # true = bots only reply when mentioned ("@BotName", "BotName," or a direct question to them)
  mention-only: false
  # Bots hear and can react to chat within this radius (blocks)
  hearing-range: 32
  # Delay range before a bot answers, keeps conversations natural
  reply-delay-min-ms: 800
  reply-delay-max-ms: 2500
  # Max consecutive bot->bot replies to stop infinite loops
  max-bot-chain: 3

# Default settings applied to spawned bots
defaults:
  gamemode: survival     # survival | creative  (creative = free items)
  allow-commands: false   # may the bot run server commands via !command
  persona: "You are a helpful player who loves building and exploring."

# Performance
performance:
  # ProtocolLib (required) cleans up a bot's tab-list entry when it despawns.
  # While alive the entry MUST stay, otherwise clients render the bot invisible.

# Bots defined here are spawned automatically on server start.
bots:
  - name: "Alex"
    persona: "You are Alex, a cheerful builder. You love redstone and big projects."
    gamemode: survival
    allow-commands: false
    skin: "Notch"          # any premium Minecraft username (or raw base64 texture value)
