name: AIBots
version: '1.0.0'
main: dev.kilo.aibots.AIBotPlugin
api-version: '26.2'
description: Physical AI players with LLM brains - walk, craft, mine, place and chat like real players.
softdepend: [ProtocolLib]
author: kilo
commands:
  aibot:
    description: Manage AI bots
    usage: /aibot <spawn|remove|list|say|stop|reload|info>
    permission: aibots.admin
permissions:
  aibots.admin:
    description: Allows managing AI bots
    default: op
